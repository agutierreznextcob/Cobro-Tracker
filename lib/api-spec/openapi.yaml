      properties:
        count:
          type: integer

    PortalCobro:
      type: object
      required: [id, descripcion, montoACobrar, saldo, estado]
      properties:
        id:
          type: integer
        descripcion:
          type: string
        montoACobrar:
          type: number
          description: Net amount to charge after discount
        saldo:
          type: number
          description: Outstanding balance (montoACobrar minus confirmed abonos)
        estado:
          type: string
          enum: [pendiente, vencido, parcial, pagado]
        fechaVencimiento:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        linkPago:
          type: ["string", "null"]
          description: Existing Flow or MercadoPago payment URL, if any

    PortalData:
      type: object
      required: [empresa, clienteNombre, pendientes, pagados]
      properties:
        empresa:
          type: string
          description: Name of the business collecting the debt
        clienteNombre:
          type: string
        pendientes:
          type: array
          items:
            $ref: "#/components/schemas/PortalCobro"
        pagados:
          type: array
          items:
            $ref: "#/components/schemas/PortalCobro"

    EnviarPortalInput:
      type: object
      required: [canal]
      properties:
        canal:
          type: string
          enum: [email, whatsapp, ambos]

    EnviarPortalResult:
      type: object
      required: [ok, url]
      properties:
        ok:
          type: boolean
        url:
          type: string
        emailEnviado:
          type: boolean
        whatsappEnviado:
          type: boolean
        portalEnviadoEn:
          type: ["string", "null"]
          format: date-time
        portalEnviadoCanal:
          type: ["string", "null"]
        mensaje:
          type: ["string", "null"]

    RegenerarPortalResult:
      type: object
      required: [ok, url]
      properties:
        ok:
          type: boolean
        url:
          type: string

    RecordatoriosRunResult:
      type: object
      required: [ok, fecha, emailsEnviados, whatsappsEnviados, notificacionesCreadas, errores]
      properties:
        ok:
          type: boolean
        fecha:
          type: string
          format: date
        emailsEnviados:
          type: integer
        whatsappsEnviados:
          type: integer
        notificacionesCreadas:
          type: integer
        errores:
          type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AiConversation:
      type: object
      required: [id, title, creadoEn]
      properties:
        id:
          type: integer
        title:
          type: string
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time

    AiConversationInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1

    AiMessage:
      type: object
      required: [id, conversationId, role, content, creadoEn]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        creadoEn:
          type: string
          format: date-time

    AiMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    AiConversationWithMessages:
      type: object
      required: [id, title, creadoEn, messages]
      properties:
        id:
          type: integer
        title:
          type: string
        creadoEn:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AiMessage"

    Liquidacion:
      type: object
      required: [id, depositDate, amount, netAmount, fee, nOrders]
      properties:
        id:
          type: integer
        depositDate:
          type: string
          description: Date of bank deposit (YYYY-MM-DD)
        amount:
          type: number
          description: Gross amount
        netAmount:
          type: number
          description: Net amount after fees
        fee:
          type: number
          description: Total fees charged by Flow
        nOrders:
          type: integer
          description: Number of payments included in this settlement

    LiquidacionListResponse:
      type: object
      required: [total, hasMore, data]
      properties:
        total:
          type: integer
        hasMore:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Liquidacion"

    PagoLiquidacion:
      type: object
      required: [flowOrder, commerceOrder, requestDate, status, subject, currency, amount, payer]
      properties:
        flowOrder:
          type: integer
        commerceOrder:
          type: string
        requestDate:
          type: string
        status:
          type: integer
          description: "1=pending, 2=paid, 3=rejected, 4=cancelled"
        subject:
          type: string
        currency:
          type: string
        amount:
          type: number
        payer:
          type: string
        paymentData:
          type: object
          properties:
            date:
              type: string
            media:
              type: string
            amount:
              type: number
            fee:
              type: number

    LiquidacionDetalle:
      allOf:
        - $ref: "#/components/schemas/Liquidacion"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/PagoLiquidacion"

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        accountId:
          type: [string, 'null']
          description: Permanent human-friendly account identifier (NCB-XXXXXXX).
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        emailVerified:
          type: boolean
        esDemo:
          type: boolean
        role:
          type: string
          enum: [user, admin]
        orgRole:
          type: [string, 'null']
          enum: [admin_org, supervisor, ejecutivo, null]
          description: Role within the user's organization
        organizationId:
          type: [integer, 'null']
        profileCompleted:
          type: boolean
        rut:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        address:
          type: [string, 'null']
        companyName:
          type: [string, 'null']
        esConsultor:
          type: boolean
          description: True cuando la sesión es de un consultor de soporte NextCob actuando sobre esta cuenta.
        consultorNombre:
          type: [string, 'null']
        consultorInicioEn:
          type: [string, 'null']
          format: date-time
    CompletarPerfilInput:
      type: object
      required: [firstName, lastName, rut, phone, address]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        rut:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        companyName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
          description: >-
            Optional profile photo, as an http(s) URL or a data:image/ URL.
            Ignored when omitted (undefined leaves the current photo unchanged).
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    RegisterInput:
      type: object
      required: [nombre, rut, email, password, confirmPassword, aceptaPolitica]
      properties:
        nombre:
          type: string
          minLength: 1
          description: Full name (split into first/last name server-side).
        rut:
          type: string
          minLength: 1
          description: Chilean RUT (validated and normalized server-side).
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string
          minLength: 8
        aceptaPolitica:
          type: boolean
          description: >-
            Ley 21.719 consent. Must be true: the user accepted the Privacy
            Policy and Terms of Use. Recorded with a timestamp server-side.
    EliminarCuentaInput:
      type: object
      required: [confirmacion]
      properties:
        confirmacion:
          type: string
          description: >-
            Must equal "ELIMINAR" to confirm permanent, irreversible deletion of
            the account and all associated data.
    ExportarDatosResult:
      type: object
      required: [exportadoEn, perfil, cobros, clientes]
      properties:
        exportadoEn:
          type: string
          description: ISO timestamp the export was generated.
        perfil:
          type: object
          additionalProperties: true
          description: The user's profile fields (no password hash or secrets).
        cobros:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Cobros the user can access (their own / their organization).
        clientes:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Clientes the user can access (their own / their organization).
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        recordarme:
          type: boolean
          description: Keep me logged in (longer session).
    EmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordInput:
      type: object
      required: [token, password, confirmPassword]
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string
          minLength: 8
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: Mínimo 8 caracteres, con al menos una mayúscula y un número.
    AuthResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        mensaje:
          type: [string, 'null']
        code:
          type: [string, 'null']
          description: Machine-readable code (e.g. email_no_verificado, cuenta_bloqueada).
    RegisterResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        mensaje:
          type: [string, 'null']
        requiereVerificacion:
          type: boolean
        trialUsado:
          type: boolean
          description: True when the RUT had already used its lifetime free trial.
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    OrganizacionInfo:
      type: object
      required:
        [
          id,
          nombre,
          esAdmin,
          miembrosActivos,
          planBaseNeto,
          planBaseIva,
          planBase,
          costoUsuarioAdicionalNeto,
          costoUsuarioAdicionalIva,
          costoUsuarioAdicional,
          usuariosAdicionales,
          totalMensual,
        ]
      properties:
        id:
          type: integer
        nombre:
          type: string
        esAdmin:
          type: boolean
          description: Whether the current user is an admin_org of this organization
        miembrosActivos:
          type: integer
          description: Number of active members in the organization
        planBaseNeto:
          type: number
          description: Base plan net price (currency units), before IVA, covering the first seat
        planBaseIva:
          type: number
          description: Base plan IVA (19%) amount (currency units)
        planBase:
          type: number
          description: Monthly base plan total (currency units), IVA included (neto + IVA)
        costoUsuarioAdicionalNeto:
          type: number
          description: Net price per additional seat (currency units), before IVA
        costoUsuarioAdicionalIva:
          type: number
          description: IVA (19%) amount per additional seat (currency units)
        costoUsuarioAdicional:
          type: number
          description: Monthly total per additional seat (currency units), IVA included
        usuariosAdicionales:
          type: integer
          description: Number of seats beyond the first
        totalMensual:
          type: number
          description: Estimated monthly total, IVA included (planBase + usuariosAdicionales * costoUsuarioAdicional)

    MiembroEquipo:
      type: object
