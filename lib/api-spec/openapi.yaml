          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: resultado
          in: query
          required: false
          schema:
            type: string
            enum: [exitoso, fallido]
          description: Filter by outcome
        - name: evento
          in: query
          required: false
          schema:
            type: string
          description: Filter by event type (exact match)
      responses:
        "200":
          description: Paginated list of webhook events with total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEventosPage"

