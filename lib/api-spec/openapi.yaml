        isAdmin:
          type: boolean
        diasRestantes:
          type: integer
          nullable: true
        trialEndsAt:
          type: string
          nullable: true
        periodEnd:
          type: string
          nullable: true
        tieneSuscripcion:
          type: boolean
        precioMensual:
          type: integer
