    AdminUsuario:
      type: object
      required:
        [
          id,
          accountId,
          nombre,
          email,
          role,
          subscriptionStatus,
          hasAccess,
          isAdmin,
          tieneSuscripcion,
          createdAt,
          trialEndsAt,
          subscriptionPeriodEnd,
          vencimiento,
          diasParaVencer,
          requiereRecordatorio,
          rut,
          esDemo,
          activo,
          usuariosExtra,
          montoMensual,
          totalRecaudado,
          ultimoPagoEn,
          ultimoPagoMonto,
          proximoCobroEn,
        ]
      properties:
        id:
          type: string
        accountId:
          type: [string, 'null']
          description: Permanent human-friendly account identifier (NCB-XXXXXXX).
        nombre:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        role:
          type: string
          enum: [user, admin]
        subscriptionStatus:
          type: string
          enum: [prueba, activa, vencida, cancelada]
        hasAccess:
          type: boolean
        isAdmin:
          type: boolean
        tieneSuscripcion:
          type: boolean
        createdAt:
          type: [string, 'null']
        trialEndsAt:
          type: [string, 'null']
        subscriptionPeriodEnd:
          type: [string, 'null']
        vencimiento:
          type: [string, 'null']
        diasParaVencer:
          type: [integer, 'null']
        requiereRecordatorio:
          type: boolean
        rut:
          type: [string, 'null']
        esDemo:
          type: boolean
        activo:
          type: boolean
        usuariosExtra:
          type: integer
          description: Active org members beyond the owner.
        montoMensual:
          type: integer
          description: Monthly amount (base plan + extra seats), IVA included.
        totalRecaudado:
          type: integer
          description: Total collected (paid cobros) for the user's organization.
        ultimoPagoEn:
          type: [string, 'null']
          description: Date of the last successful subscription payment.
        ultimoPagoMonto:
          type: [integer, 'null']
          description: Amount (CLP, IVA incl.) of the last subscription payment.
        proximoCobroEn:
          type: [string, 'null']
          description: Next scheduled subscription charge date (active subs only).

    AdminMetricas:
