          type: string
          format: email
        orgRole:
          type: string
          enum: [admin_org, supervisor, ejecutivo]
        supervisorId:
          type: [string, 'null']
          description: For ejecutivo invitations, the supervisor the new member will report to
        estado:
          type: string
          enum: [pendiente, aceptada, cancelada, expirada]
        invitadoPorNombre:
          type: [string, 'null']
        creadoEn:
          type: string
          format: date-time
