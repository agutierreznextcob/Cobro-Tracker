        costoUsuarioAdicionalIva:
          type: integer
        costoUsuarioAdicional:
          type: integer
        totalNetoMensual:
          type: integer
        totalIvaMensual:
          type: integer
        totalMensual:
          type: integer
          description: Total monthly charge in CLP (base + extra seats, IVA incl.)

