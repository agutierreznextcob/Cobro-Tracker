        orgRole:
          type: [string, 'null']
          enum: [admin_org, supervisor, ejecutivo, null]
        supervisorId:
          type: [string, 'null']
          description: For ejecutivos, the supervisor they report to
        supervisorNombre:
          type: [string, 'null']
        cobrosAsignados:
          type: integer
        cobrosPagados:
          type: integer
        cobrosPendientes:
          type: integer
        montoRecaudado:
