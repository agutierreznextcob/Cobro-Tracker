openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Cobros (charges) management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cobros
    description: Cobros (charges) operations
  - name: clientes
    description: Clientes operations
  - name: ai
    description: AI assistant chat operations
  - name: liquidaciones
    description: Liquidaciones (settlements) from Flow
  - name: webhooks
    description: Webhook endpoints
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: leads
    description: Sales leads from the public landing page
  - name: portal
    description: Public debtor portal (magic link)
  - name: workflows
    description: Collections automation workflows
  - name: tareas
    description: Ejecutivo tasks created by workflows
  - name: encuestas
    description: Client satisfaction surveys
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '200':
          description: Account created; a verification email was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResult'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '409':
          description: Email or RUT already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged in; a session cookie was set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '403':
          description: Email not verified or account deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '423':
          description: Account temporarily locked after too many attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Clear the current session
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: If the email exists, a reset link was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Invalid or expired token, or weak password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the current user's password (requires the current password)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Wrong current password or weak new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend the email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: If the account exists and is unverified, a link was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
  /auth/verify-email:
    get:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify an email address using a token from the email link
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the login page with a verification status flag.

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clientes:
    get:
      operationId: listClientes
      tags: [clientes]
      summary: List clientes for the current user
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search by nombre or RUT
      responses:
        "200":
          description: List of clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClienteConScore"
        "401":
          description: Unauthorized
    post:
      operationId: createCliente
      tags: [clientes]
      summary: Create a new cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
      responses:
        "201":
          description: Created cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /clientes/importar:
    post:
      operationId: importarClientes
      tags: [clientes]
      summary: Bulk-import clientes from parsed spreadsheet rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportarClientesInput"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportarClientesResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /clientes/{id}:
    get:
      operationId: getCliente
      tags: [clientes]
      summary: Get a cliente by ID with cobros history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cliente with cobros history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteConHistorial"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
    patch:
      operationId: updateCliente
      tags: [clientes]
      summary: Update a cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
      responses:
        "200":
          description: Updated cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /ai/conversations:
    get:
      operationId: listAiConversations
      tags: [ai]
      summary: List all AI conversations for the current user
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiConversation"
        "401":
          description: Unauthorized
    post:
      operationId: createAiConversation
      tags: [ai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiConversation"
        "401":
          description: Unauthorized

  /ai/conversations/{id}:
    get:
      operationId: getAiConversation
      tags: [ai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiConversationWithMessages"
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      operationId: deleteAiConversation
      tags: [ai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "401":
          description: Unauthorized

  /ai/conversations/{id}/messages:
    post:
      operationId: sendAiMessage
      tags: [ai]
      summary: Send a user message and stream the AI response (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /liquidaciones:
    get:
      operationId: listLiquidaciones
      tags: [liquidaciones]
      summary: List settlements from Flow
      parameters:
        - name: start
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Pagination offset
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        "200":
          description: List of settlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidacionListResponse"
        "401":
          description: Unauthorized
        "422":
          description: Flow credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Flow API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /liquidaciones/{id}:
    get:
      operationId: getLiquidacion
      tags: [liquidaciones]
      summary: Get settlement detail (included payments) from Flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Settlement detail with payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidacionDetalle"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "422":
          description: Flow credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Flow API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros:
    get:
      operationId: listCobros
      tags: [cobros]
      summary: List all cobros
      description: Returns all cobros ordered by creation date desc
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [pendiente, pagado, parcial, fallido, cancelado]
        - name: metodo
          in: query
          required: false
          description: "flow=solo Flow, mp=solo MP, link=cualquier pasarela, manual=sin pasarela"
          schema:
            type: string
            enum: [flow, mp, link, manual]
      responses:
        "200":
          description: List of cobros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cobro"

    post:
      operationId: createCobro
      tags: [cobros]
      summary: Create a new cobro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobroInput"
      responses:
        "201":
          description: Created cobro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/{id}:
    get:
      operationId: getCobro
      tags: [cobros]
      summary: Get a cobro by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cobro found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateCobro
      tags: [cobros]
      summary: Update cobro status or fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobroUpdate"
      responses:
        "200":
          description: Updated cobro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "400":
          description: Edit not allowed for this cobro state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: eliminarCobro
      tags: [cobros]
      summary: Delete a cobro
      description: >-
        Hard-deletes a cobro and all its associated data (payment links,
        reminders, follow-ups, discounts, partial payments) but NOT the client.
        Not allowed when the cobro is paid or already has confirmed partial
        payments. Records a snapshot in the superadmin deletion audit log.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EliminarCobroInput"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Deletion not allowed for this cobro state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/{id}/ajustar-monto:
    post:
      operationId: ajustarMonto
      tags: [cobros]
      summary: Adjust the total amount of a cobro with partial payments
      description: >-
        Lowers the total amount of a cobro that has confirmed partial payments.
        The new amount must be greater than or equal to the amount already paid.
        If it equals the paid amount, the cobro is marked as paid. Records the
        adjustment (with an obligatory reason) in the cobro's history.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjustarMontoInput"
      responses:
        "200":
          description: Adjustment applied, returns updated cobro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cobro not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/{id}/ajustes:
    get:
      operationId: listAjustes
      tags: [cobros]
      summary: List amount-adjustment history for a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of amount adjustments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CobroAjuste"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found

  /cobros/stats/summary:
    get:
      operationId: getCobrosSummary
      tags: [cobros]
      summary: Get cobros summary statistics
      description: Returns totals grouped by status and overall amount
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobrosSummary"

  /dashboard/metrics:
    get:
      operationId: getDashboardMetrics
      tags: [cobros]
      summary: Get dashboard metrics for the current user
      description: Returns key performance metrics scoped to the current user, with period filtering
      parameters:
        - name: periodo
          in: query
          required: false
          schema:
            type: string
            enum: [hoy, semana, mes, total]
            default: mes
        - name: responsable
          in: query
          required: false
          description: Filter by a specific ejecutivo (org admins only)
          schema:
            type: string
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetricas"
        "401":
          description: Unauthorized

  /dashboard/salud-cartera:
    get:
      operationId: getSaludCartera
      tags: [cobros]
      summary: Portfolio health panel for the dashboard
      description: Traffic-light classification of outstanding cobros, prioritized action list, and week-over-week trend, scoped to the current user
      responses:
        "200":
          description: Portfolio health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaludCartera"
        "401":
          description: Unauthorized

  /dashboard/salud-cartera/historial:
    get:
      operationId: getSaludCarteraHistorial
      tags: [cobros]
      summary: Historical evolution of the portfolio health blocks
      description: Daily salud-de-cartera snapshots for the current user over a 30 or 90 day range. Days without a snapshot are absent from the list.
      parameters:
        - name: dias
          in: query
          required: false
          schema:
            type: integer
            enum: [30, 90]
            default: 30
      responses:
        "200":
          description: Snapshot history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaludCarteraHistorial"
        "401":
          description: Unauthorized

  /profile/flow-credentials:
    get:
      operationId: getFlowCredentials
      tags: [profile]
      summary: Get Flow credentials status for current user
      responses:
        "200":
          description: Credentials status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowCredentialsStatus"
        "401":
          description: Unauthorized
    put:
      operationId: saveFlowCredentials
      tags: [profile]
      summary: Save or update Flow API credentials for current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowCredentialsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteFlowCredentials
      tags: [profile]
      summary: Delete Flow credentials for current user
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthorized

  /profile/datos:
    put:
      operationId: completarPerfil
      tags: [profile]
      summary: Save mandatory profile data and mark the profile as completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletarPerfilInput"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /profile/exportar-datos:
    get:
      operationId: exportarDatos
      tags: [profile]
      summary: Export all of the user's personal data (Ley 21.719 portability)
      responses:
        "200":
          description: Full data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportarDatosResult"
        "401":
          description: Unauthorized

  /profile/cuenta:
    delete:
      operationId: eliminarCuenta
      tags: [profile]
      summary: Permanently delete the user's account and all their data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EliminarCuentaInput"
      responses:
        "200":
          description: Account deleted; session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Confirmation missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Account type cannot be self-deleted (demo/admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Organization has other members; cannot delete owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/{id}/recordatorio-email:
    post:
      operationId: enviarRecordatorioEmail
      tags: [cobros]
      summary: Send a payment reminder email for a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Cannot send email (no email or no payment link configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
