components:
  schemas:
    AdminUsuario:
      type: object
      required:
        [
          id,
          nombre,
          email,
          role,
          subscriptionStatus,
          hasAccess,
          isAdmin,
          tieneSuscripcion,
          createdAt,
          trialEndsAt,
          subscriptionPeriodEnd,
          vencimiento,
          diasParaVencer,
          requiereRecordatorio,
        ]
      properties:
        id:
          type: string
        nombre:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        role:
          type: string
          enum: [user, admin]
        subscriptionStatus:
          type: string
          enum: [prueba, activa, vencida]
        hasAccess:
          type: boolean
        isAdmin:
          type: boolean
        tieneSuscripcion:
          type: boolean
        createdAt:
          type: [string, 'null']
        trialEndsAt:
          type: [string, 'null']
        subscriptionPeriodEnd:
          type: [string, 'null']
        vencimiento:
          type: [string, 'null']
        diasParaVencer:
          type: [integer, 'null']
        requiereRecordatorio:
          type: boolean

    AdminRecordatorioResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: [string, 'null']

    SubscriptionStatus:
      type: object
      required: [status, hasAccess, isAdmin, tieneSuscripcion, precioMensual, precioNeto, precioIva]
      properties:
        status:
          type: string
          enum: [prueba, activa, vencida]
        hasAccess:
          type: boolean
        isAdmin:
          type: boolean
        diasRestantes:
          type: integer
          nullable: true
        trialEndsAt:
          type: string
          nullable: true
        periodEnd:
          type: string
          nullable: true
        tieneSuscripcion:
          type: boolean
        precioMensual:
          type: integer
          description: Monthly charged total in CLP, IVA included (neto + IVA)
        precioNeto:
          type: integer
          description: Monthly net price in CLP, before IVA
        precioIva:
          type: integer
          description: Monthly IVA (19%) amount in CLP

    SubscribeResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Cliente:
      type: object
      required: [id, nombre, userId, creadoEn, actualizadoEn]
      properties:
        id:
          type: integer
        nombre:
          type: string
        rut:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        userId:
          type: string
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time

    ClienteInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
        rut:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string

    ClienteConHistorial:
      type: object
      required: [id, nombre, userId, creadoEn, actualizadoEn, cobros]
      properties:
        id:
          type: integer
        nombre:
          type: string
        rut:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        userId:
          type: string
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
        cobros:
          type: array
          items:
            $ref: "#/components/schemas/Cobro"

    DashboardMetricas:
      type: object
      required: [transaccionesPagadas, montoRecaudado, ticketPromedio, pendientesCantidad, pendientesMonto, periodo]
      properties:
        transaccionesPagadas:
          type: integer
        montoRecaudado:
          type: number
        ticketPromedio:
          type: number
        pendientesCantidad:
          type: integer
        pendientesMonto:
          type: number
        periodo:
          type: string
          enum: [hoy, semana, mes, total]

    Cobro:
      type: object
      required: [id, monto, descripcion, estado, creadoEn]
      properties:
        id:
          type: integer
        monto:
          type: number
          description: Original amount in currency units
        montoDescuento:
          type: ["number", "null"]
          description: Current effective discount amount in currency units (absolute)
        montoACobrar:
          type: number
          description: Net amount to charge after the current discount (monto - montoDescuento)
        saldo:
          type: number
          description: Outstanding balance (montoACobrar minus confirmed abonos); 0 for terminal states. Present on list and detail responses.
        incluyeIva:
          type: boolean
          description: Whether Chilean VAT (IVA 19%) is applied. When true, `monto` is the total (neto + iva).
        montoNeto:
          type: ["number", "null"]
          description: Net amount before IVA (only set when incluyeIva is true)
        montoIva:
          type: ["number", "null"]
          description: IVA amount (19% of montoNeto, only set when incluyeIva is true)
        descripcion:
          type: string
        estado:
          type: string
          enum: [pendiente, pagado, parcial, fallido, cancelado]
        referencia:
          type: ["string", "null"]
          description: Optional external reference (e.g. payment provider ID)
        organizationId:
          type: ["integer", "null"]
          description: Organization this cobro belongs to
        responsableId:
          type: ["string", "null"]
          description: User ID of the ejecutivo/admin this cobro is assigned to
        responsableNombre:
          type: ["string", "null"]
          description: Display name of the assigned ejecutivo/admin
        clienteId:
          type: ["integer", "null"]
          description: ID of the associated cliente
        clienteNombre:
          type: ["string", "null"]
          description: Name of the associated cliente
        emailPagador:
          type: ["string", "null"]
          description: Email of the payer for Flow payment link
        fechaVencimiento:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Due date (YYYY-MM-DD) used to schedule reminders
        flowOrdenId:
          type: ["string", "null"]
          description: Flow order ID returned after creating payment
        flowLinkPago:
          type: ["string", "null"]
          description: Flow payment URL for the payer
        mpPreferenceId:
          type: ["string", "null"]
