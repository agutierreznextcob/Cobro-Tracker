openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Cobros (charges) management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cobros
    description: Cobros (charges) operations
  - name: webhooks
    description: Webhook endpoints
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cobros:
    get:
      operationId: listCobros
      tags: [cobros]
      summary: List all cobros
      description: Returns all cobros ordered by creation date desc
      responses:
        "200":
          description: List of cobros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cobro"

    post:
      operationId: createCobro
      tags: [cobros]
      summary: Create a new cobro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobroInput"
      responses:
        "201":
          description: Created cobro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/{id}:
    get:
      operationId: getCobro
      tags: [cobros]
      summary: Get a cobro by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cobro found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateCobro
      tags: [cobros]
      summary: Update cobro status or fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobroUpdate"
      responses:
        "200":
          description: Updated cobro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/stats/summary:
    get:
      operationId: getCobrosSummary
      tags: [cobros]
      summary: Get cobros summary statistics
      description: Returns totals grouped by status and overall amount
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobrosSummary"

  /profile/flow-credentials:
    get:
      operationId: getFlowCredentials
      tags: [profile]
      summary: Get Flow credentials status for current user
      responses:
        "200":
          description: Credentials status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowCredentialsStatus"
        "401":
          description: Unauthorized
    put:
      operationId: saveFlowCredentials
      tags: [profile]
      summary: Save or update Flow API credentials for current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowCredentialsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteFlowCredentials
      tags: [profile]
      summary: Delete Flow credentials for current user
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthorized

  /cobros/{id}/flow-link:
    post:
      operationId: generarFlowLink
      tags: [cobros]
      summary: Generate a Flow payment link for a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerarFlowLinkInput"
      responses:
        "200":
          description: Payment link generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowLinkResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found

  /webhooks/flow:
    post:
      operationId: receiveFlowWebhook
      tags: [webhooks]
      summary: Receive payment confirmation from Flow
      description: Flow calls this endpoint when a payment is completed. No signature required (Flow uses token-based confirmation).
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /webhooks/cobro:
    post:
      operationId: receiveCobroWebhook
      tags: [webhooks]
      summary: Receive a cobro webhook
      description: Endpoint to receive external payment provider webhook events for cobros. Requires X-Webhook-Signature header (HMAC-SHA256).
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
          description: "HMAC-SHA256 signature of the raw request body: sha256=<hex>"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/eventos:
    get:
      operationId: listWebhookEventos
      tags: [webhooks]
      summary: List webhook audit log
      description: Returns all received webhook events ordered by date desc
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: resultado
          in: query
          required: false
          schema:
            type: string
            enum: [exitoso, fallido]
          description: Filter by outcome
        - name: evento
          in: query
          required: false
          schema:
            type: string
          description: Filter by event type (exact match)
      responses:
        "200":
          description: Paginated list of webhook events with total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEventosPage"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Cobro:
      type: object
      required: [id, monto, descripcion, estado, creadoEn]
      properties:
        id:
          type: integer
        monto:
          type: number
          description: Amount in currency units
        descripcion:
          type: string
        estado:
          type: string
          enum: [pendiente, pagado, fallido, cancelado]
        referencia:
          type: ["string", "null"]
          description: Optional external reference (e.g. payment provider ID)
        responsableId:
          type: ["string", "null"]
          description: User ID of the person who created this cobro
        responsableNombre:
          type: ["string", "null"]
          description: Display name of the person who created this cobro
        emailPagador:
          type: ["string", "null"]
          description: Email of the payer for Flow payment link
        flowOrdenId:
          type: ["string", "null"]
          description: Flow order ID returned after creating payment
        flowLinkPago:
          type: ["string", "null"]
          description: Flow payment URL for the payer
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time

    CobroInput:
      type: object
      required: [monto, descripcion]
      properties:
        monto:
          type: number
          minimum: 0.01
        descripcion:
          type: string
          minLength: 1
        referencia:
          type: string
        emailPagador:
          type: string
          format: email

    FlowCredentialsStatus:
      type: object
      required: [configurado]
      properties:
        configurado:
          type: boolean

    FlowCredentialsInput:
      type: object
      required: [apiKey, secretKey]
      properties:
        apiKey:
          type: string
          minLength: 1
        secretKey:
          type: string
          minLength: 1

    GenerarFlowLinkInput:
      type: object
      required: [emailPagador]
      properties:
        emailPagador:
          type: string
          format: email

    FlowLinkResponse:
      type: object
      required: [linkPago, flowOrdenId]
      properties:
        linkPago:
          type: string
        flowOrdenId:
          type: string

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    CobroUpdate:
      type: object
      properties:
        estado:
          type: string
          enum: [pendiente, pagado, fallido, cancelado]
        descripcion:
          type: string
          minLength: 1
        referencia:
          type: string

    CobrosSummary:
      type: object
      required: [total, montoTotal, porEstado]
      properties:
        total:
          type: integer
        montoTotal:
          type: number
        porEstado:
          type: array
          items:
            $ref: "#/components/schemas/EstadoCount"

    EstadoCount:
      type: object
      required: [estado, cantidad, monto]
      properties:
        estado:
          type: string
        cantidad:
          type: integer
        monto:
          type: number

    WebhookPayload:
      type: object
      required: [evento, cobroId]
      properties:
        evento:
          type: string
          description: Event type (e.g. pago.completado, pago.fallido)
        cobroId:
          type: integer
          description: ID of the cobro this event refers to
        referencia:
          type: string
          description: External payment reference
        datos:
          type: object
          description: Additional event data

    WebhookResponse:
      type: object
      required: [recibido]
      properties:
        recibido:
          type: boolean
        cobroActualizado:
          type: ["boolean", "null"]

    WebhookEventosPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvento"
        total:
          type: integer
          description: Total number of events matching the filters
        limit:
          type: integer
        offset:
          type: integer
        eventosUnicos:
          type: array
          items:
            type: string
          description: Distinct event types present in the full dataset

    WebhookEvento:
      type: object
      required: [id, evento, resultado, exitoso, creadoEn]
      properties:
        id:
          type: integer
        evento:
          type: string
        cobroId:
          type: ["integer", "null"]
        ipOrigen:
          type: ["string", "null"]
        resultado:
          type: string
          enum: [exitoso, fallido]
        exitoso:
          type: boolean
        detalle:
          type: ["string", "null"]
        creadoEn:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: "Opaque session token — Bearer <sid>."
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
