    Cobro:
      type: object
      required: [id, monto, descripcion, estado, creadoEn]
      properties:
        id:
          type: integer
        monto:
          type: number
          description: Original amount in currency units
        montoDescuento:
          type: ["number", "null"]
          description: Current effective discount amount in currency units (absolute)
        montoACobrar:
          type: number
          description: Net amount to charge after the current discount (monto - montoDescuento)
        saldo:
          type: number
          description: Outstanding balance (montoACobrar minus confirmed abonos); 0 for terminal states. Present on list and detail responses.
        incluyeIva:
          type: boolean
          description: Whether Chilean VAT (IVA 19%) is applied. When true, `monto` is the total (neto + iva).
        montoNeto:
          type: ["number", "null"]
          description: Net amount before IVA (only set when incluyeIva is true)
        montoIva:
          type: ["number", "null"]
          description: IVA amount (19% of montoNeto, only set when incluyeIva is true)
        tipoDocumento:
          type: string
          enum: [factura_afecta, factura_exenta, boleta_afecta, boleta_exenta, sin_documento]
          description: Chilean electronic tax document type (DTE). Only "afecta" types carry IVA.
        descripcion:
          type: string
        estado:
          type: string
          enum: [pendiente, pagado, parcial, fallido, cancelado]
        referencia:
          type: ["string", "null"]
          description: Optional external reference (e.g. payment provider ID)
        organizationId:
          type: ["integer", "null"]
          description: Organization this cobro belongs to
        responsableId:
          type: ["string", "null"]
          description: User ID of the ejecutivo/admin this cobro is assigned to
        responsableNombre:
          type: ["string", "null"]
          description: Display name of the assigned ejecutivo/admin
        clienteId:
          type: ["integer", "null"]
          description: ID of the associated cliente
        clienteNombre:
          type: ["string", "null"]
          description: Name of the associated cliente
        emailPagador:
          type: ["string", "null"]
          description: Email of the payer for Flow payment link
        fechaVencimiento:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Due date (YYYY-MM-DD) used to schedule reminders
        flowOrdenId:
          type: ["string", "null"]
          description: Flow order ID returned after creating payment
        flowLinkPago:
          type: ["string", "null"]
          description: Flow payment URL for the payer
        mpPreferenceId:
          type: ["string", "null"]
          description: MercadoPago preference ID
        mpPaymentLinkUrl:
          type: ["string", "null"]
          description: MercadoPago checkout URL for the payer
        workflowId:
          type: ["integer", "null"]
          description: ID of the collections workflow assigned to this cobro (null when using simple reminders)
        pagadoEn:
          type: ["string", "null"]
          format: date-time
          description: When the cobro was confirmed as fully paid (null until paid). Use for revenue-by-period reporting.
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time

    CobroInput:
      type: object
      required: [monto, descripcion]
      properties:
        monto:
          type: number
          minimum: 0.01
          description: Amount entered by the user. When incluyeIva is true this is the NETO (pre-IVA); the server computes iva and total. When false, this is the final charge.
        incluyeIva:
          type: boolean
          description: Apply Chilean VAT (IVA 19%). When true, `monto` is treated as the neto and the server computes IVA and total. Ignored (forced false) unless tipoDocumento is an "afecta" type.
        tipoDocumento:
          type: string
          enum: [factura_afecta, factura_exenta, boleta_afecta, boleta_exenta, sin_documento]
