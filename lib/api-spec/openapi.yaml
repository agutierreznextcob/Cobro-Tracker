        email:
          type: [string, 'null']
          format: email
        orgRole:
          type: [string, 'null']
          enum: [admin_org, supervisor, ejecutivo, null]
        supervisorId:
          type: [string, 'null']
          description: For ejecutivos, the user id of the supervisor they report to
        supervisorNombre:
          type: [string, 'null']
        activo:
          type: boolean
        esOwner:
          type: boolean
          description: Whether this member is the organization owner
        createdAt:
          type: [string, 'null']

    Invitacion:
      type: object
      required: [id, email, orgRole, estado, creadoEn]
      properties:
        id:
