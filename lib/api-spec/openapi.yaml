components:
  schemas:
    WorkflowCondiciones:
      type: object
      properties:
        montoMin:
          type: ["number", "null"]
        montoMax:
          type: ["number", "null"]
        scores:
          type: ["array", "null"]
          items:
            type: string
        tiposDocumento:
          type: ["array", "null"]
          items:
            type: string
        clienteIds:
          type: ["array", "null"]
          items:
            type: integer
        responsableIds:
          type: ["array", "null"]
          items:
            type: string
    WorkflowStepConfig:
