openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Cobros (charges) management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cobros
    description: Cobros (charges) operations
  - name: clientes
    description: Clientes operations
  - name: ai
    description: AI assistant chat operations
  - name: liquidaciones
    description: Liquidaciones (settlements) from Flow
  - name: webhooks
    description: Webhook endpoints
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: leads
    description: Sales leads from the public landing page
  - name: portal
    description: Public debtor portal (magic link)
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clientes:
    get:
      operationId: listClientes
      tags: [clientes]
      summary: List clientes for the current user
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search by nombre or RUT
      responses:
        "200":
          description: List of clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cliente"
        "401":
          description: Unauthorized
    post:
      operationId: createCliente
      tags: [clientes]
      summary: Create a new cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
      responses:
        "201":
          description: Created cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /clientes/{id}:
    get:
      operationId: getCliente
      tags: [clientes]
      summary: Get a cliente by ID with cobros history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cliente with cobros history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteConHistorial"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
    patch:
      operationId: updateCliente
      tags: [clientes]
      summary: Update a cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
      responses:
        "200":
          description: Updated cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /ai/conversations:
    get:
      operationId: listAiConversations
      tags: [ai]
      summary: List all AI conversations for the current user
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiConversation"
        "401":
          description: Unauthorized
    post:
      operationId: createAiConversation
      tags: [ai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiConversation"
        "401":
          description: Unauthorized

  /ai/conversations/{id}:
    get:
      operationId: getAiConversation
      tags: [ai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiConversationWithMessages"
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      operationId: deleteAiConversation
      tags: [ai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "401":
          description: Unauthorized

  /ai/conversations/{id}/messages:
    post:
      operationId: sendAiMessage
      tags: [ai]
      summary: Send a user message and stream the AI response (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /liquidaciones:
    get:
      operationId: listLiquidaciones
      tags: [liquidaciones]
      summary: List settlements from Flow
      parameters:
        - name: start
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Pagination offset
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        "200":
          description: List of settlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidacionListResponse"
        "401":
          description: Unauthorized
        "422":
          description: Flow credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Flow API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /liquidaciones/{id}:
    get:
      operationId: getLiquidacion
      tags: [liquidaciones]
      summary: Get settlement detail (included payments) from Flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Settlement detail with payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidacionDetalle"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "422":
          description: Flow credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Flow API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros:
    get:
      operationId: listCobros
      tags: [cobros]
      summary: List all cobros
      description: Returns all cobros ordered by creation date desc
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [pendiente, pagado, parcial, fallido, cancelado]
        - name: metodo
          in: query
          required: false
          description: "flow=solo Flow, mp=solo MP, link=cualquier pasarela, manual=sin pasarela"
          schema:
            type: string
            enum: [flow, mp, link, manual]
      responses:
        "200":
          description: List of cobros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cobro"

    post:
      operationId: createCobro
      tags: [cobros]
      summary: Create a new cobro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobroInput"
      responses:
        "201":
          description: Created cobro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/{id}:
    get:
      operationId: getCobro
      tags: [cobros]
      summary: Get a cobro by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cobro found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateCobro
      tags: [cobros]
      summary: Update cobro status or fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobroUpdate"
      responses:
        "200":
          description: Updated cobro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/stats/summary:
    get:
      operationId: getCobrosSummary
      tags: [cobros]
      summary: Get cobros summary statistics
      description: Returns totals grouped by status and overall amount
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobrosSummary"

  /dashboard/metrics:
    get:
      operationId: getDashboardMetrics
      tags: [cobros]
      summary: Get dashboard metrics for the current user
      description: Returns key performance metrics scoped to the current user, with period filtering
      parameters:
        - name: periodo
          in: query
          required: false
          schema:
            type: string
            enum: [hoy, semana, mes, total]
            default: mes
        - name: responsable
          in: query
          required: false
          description: Filter by a specific ejecutivo (org admins only)
          schema:
            type: string
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetricas"
        "401":
          description: Unauthorized

  /profile/flow-credentials:
    get:
      operationId: getFlowCredentials
      tags: [profile]
      summary: Get Flow credentials status for current user
      responses:
        "200":
          description: Credentials status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowCredentialsStatus"
        "401":
          description: Unauthorized
    put:
      operationId: saveFlowCredentials
      tags: [profile]
      summary: Save or update Flow API credentials for current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowCredentialsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteFlowCredentials
      tags: [profile]
      summary: Delete Flow credentials for current user
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthorized

  /profile/datos:
    put:
      operationId: completarPerfil
      tags: [profile]
      summary: Save mandatory profile data and mark the profile as completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletarPerfilInput"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /cobros/{id}/recordatorio-email:
    post:
      operationId: enviarRecordatorioEmail
      tags: [cobros]
      summary: Send a payment reminder email for a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Cannot send email (no email or no payment link configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/{id}/avisar:
    post:
      operationId: avisarCliente
      tags: [cobros]
      summary: Send a manual notification to the client about a pending cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvisarClienteInput"
      responses:
        "200":
          description: Notification sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvisarClienteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/{id}/seguimientos:
    get:
      operationId: listSeguimientos
      tags: [cobros]
      summary: List all manual follow-up records for a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of seguimientos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeguimientoCobranza"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found

  /cobros/{id}/abonos:
    get:
      operationId: listAbonos
      tags: [cobros]
      summary: List pagos parciales for a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of abonos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Abono"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found

    post:
      operationId: crearAbono
      tags: [cobros]
      summary: Create a pago parcial for a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbonoInput"
      responses:
        "201":
          description: Abono created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Abono"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/{id}/abonos/{abonoId}/confirmar:
    post:
      operationId: confirmarAbono
      tags: [cobros]
      summary: Manually confirm a pago parcial (for manual-method abonos)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: abonoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Abono confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Abono"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cobros/{id}/descuentos:
    get:
      operationId: listDescuentos
      tags: [cobros]
      summary: List discount history for a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of discounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Descuento"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found

    post:
      operationId: aplicarDescuento
      tags: [cobros]
      summary: Apply a discount to a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AplicarDescuentoInput"
      responses:
        "200":
          description: Discount applied, returns updated cobro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cobro"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/mp-credentials:
    get:
      operationId: getMpCredentials
      tags: [profile]
      summary: Get MercadoPago credentials status for current user
      responses:
        "200":
          description: Credentials status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpCredentialsStatus"
        "401":
          description: Unauthorized
    put:
      operationId: saveMpCredentials
      tags: [profile]
      summary: Save or update MercadoPago Access Token for current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpCredentialsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteMpCredentials
      tags: [profile]
      summary: Delete MercadoPago credentials for current user
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthorized

  /cobros/{id}/flow-link:
    post:
      operationId: generarFlowLink
      tags: [cobros]
      summary: Generate a Flow payment link for a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerarFlowLinkInput"
      responses:
        "200":
          description: Payment link generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowLinkResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found

  /cobros/{id}/mp-link:
    post:
      operationId: generarMpLink
      tags: [cobros]
      summary: Generate a MercadoPago payment link for a cobro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment link generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpLinkResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Cobro not found

  /webhooks/mercadopago:
    post:
      operationId: receiveMpWebhook
      tags: [webhooks]
      summary: Receive payment notification from MercadoPago
      description: MercadoPago calls this endpoint when a payment event occurs.
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /webhooks/flow:
    post:
      operationId: receiveFlowWebhook
      tags: [webhooks]
      summary: Receive payment confirmation from Flow
      description: Flow calls this endpoint when a payment is completed. No signature required (Flow uses token-based confirmation).
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /webhooks/cobro:
    post:
      operationId: receiveCobroWebhook
      tags: [webhooks]
      summary: Receive a cobro webhook
      description: Endpoint to receive external payment provider webhook events for cobros. Requires X-Webhook-Signature header (HMAC-SHA256).
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
          description: "HMAC-SHA256 signature of the raw request body: sha256=<hex>"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/eventos:
    get:
      operationId: listWebhookEventos
