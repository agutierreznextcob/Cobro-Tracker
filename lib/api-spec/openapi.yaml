          format: email
        orgRole:
          type: string
          enum: [admin_org, supervisor, ejecutivo]
        supervisorId:
          type: [string, 'null']
          description: For ejecutivo invitations, the supervisor the new member will report to

    ActualizarMiembroInput:
      type: object
      properties:
