kind = "web"
previewPath = "/"
title = "Cobros App"
version = "1.0.0"
id = "artifacts/cobros-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23803

[services.development]
run = "pnpm --filter @workspace/cobros-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cobros-app", "run", "build" ]
publicDir = "artifacts/cobros-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23803"
BASE_PATH = "/"
